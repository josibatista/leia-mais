<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listagem de Obras | Leia Mulheres</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body class="lmCadastroBody">
    <div id="blMenuContainer"></div>
    <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

    <header class="lmCadastroCabecalho">
      <div class="lmCadastroCabecalhoTopo">
        <button
          class="lmCabecalhoBotao"
          id="lmMenuAbrirBotao"
          aria-label="Abrir menu"
        >
          &#9776;
        </button>
      </div>

      <div class="lmCadastroCabecalhoCentro">
        <img
          src="/assets/logoLeiaMais.png"
          alt="Logo Leia Mais"
          class="lmCabecalhoLogoImagem"
        />

        <p class="lmCadastroSubtitulo">
          Área administrativa para gerenciamento das obras cadastradas.
        </p>
      </div>
    </header>

    <main class="lmListagemConteudo">
      <section class="lmListagemSecao">
        <div class="lmListagemCabecalho">
          <h2>Obras</h2>
          <p>Lista de obras cadastradas no sistema.</p>
        </div>

        <div class="lmListagemLista" id="blObrasLista">
          <p class="lmUsuariosMensagem">Carregando obras...</p>
        </div>
      </section>

      <div class="lmModalOverlay" id="blModalEditarObra">
        <div class="lmModalConteudo">
          <button
            class="lmModalFechar"
            id="blFecharModalEditarObra"
            type="button"
          >
            &times;
          </button>

          <h2 class="lmModalTitulo">Editar Obra</h2>

          <form id="blFormularioEditarObra">
            <input type="hidden" id="blEditarObraId" />

            <div class="lmGrupoCampo">
              <label for="blEditarTituloObra" class="lmRotuloCampo">Título</label>
              <input type="text" id="blEditarTituloObra" class="lmCampoTexto" required />
            </div>

            <div class="lmGrupoCampo">
              <label for="blEditarTipoObra" class="lmRotuloCampo">Tipo da obra</label>
              <select id="blEditarTipoObra" class="lmCampoSelecao" required>
                <option value="">Selecione o tipo de obra</option>
                <option value="Antologia">Antologia</option>
                <option value="Artigo">Artigo</option>
                <option value="Autobiografia">Autobiografia</option>
                <option value="Biografia">Biografia</option>
                <option value="Carta">Carta</option>
                <option value="Coletânea">Coletânea</option>
                <option value="Conto">Conto</option>
                <option value="Crônica">Crônica</option>
                <option value="Diário">Diário</option>
                <option value="Ensaio">Ensaio</option>
                <option value="Literatura infantil">Literatura infantil</option>
                <option value="Literatura juvenil">Literatura juvenil</option>
                <option value="Livro">Livro</option>
                <option value="Memórias">Memórias</option>
                <option value="Novela">Novela</option>
                <option value="Peça teatral">Peça teatral</option>
                <option value="Poema">Poema</option>
                <option value="Poesia">Poesia</option>
                <option value="Quadrinho / HQ">Quadrinho / HQ</option>
                <option value="Resenha">Resenha</option>
                <option value="Outro">Outro</option>
              </select>
            </div>

            <div class="lmGrupoCampo">
              <label for="blEditarAutorObra" class="lmRotuloCampo">Autora</label>
              <select id="blEditarAutorObra" class="lmCampoSelecao" required></select>
            </div>

            <div class="lmGrupoCampo">
              <label for="blEditarDescricaoObra" class="lmRotuloCampo">Descrição</label>
              <textarea id="blEditarDescricaoObra" class="lmCampoTextoArea"></textarea>
            </div>

            <button type="submit" class="lmBotaoSaibaMais">
              Salvar alterações
            </button>
          </form>
        </div>
      </div>

      <button
        class="lmBotaoFlutuante"
        id="blBotaoAdicionarObra"
        title="Cadastrar obra"
      >
        +
      </button>
    </main>

    <div class="lmModalOverlay" id="blModalMensagemObras">
      <div class="lmModalConteudo lmModalMensagemConteudo">
        <button class="lmModalFechar" id="blFecharModalMensagemObras" type="button">
          &times;
        </button>

        <h2 class="lmModalTitulo" id="blModalMensagemObrasTitulo">Atenção</h2>

        <p class="lmModalMensagemTexto" id="blModalMensagemObrasTexto"></p>

        <div class="lmModalMensagemAcoes">
          <button type="button" class="lmBotaoSaibaMais" id="blBotaoConfirmarMensagemObras">
            OK
          </button>
          <button type="button" class="lmBotaoCancelar" id="blBotaoCancelarMensagemObras">
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <script src="../../js/usuarios/auth.js"></script>
    <script src="../../js/menu.js"></script>
    <script src="../../js/obras/listagemObras.js"></script>
  </body>
</html>
