<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Mais - Recuperar Senha</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="blBody">
    <div class="blContainerPrincipal">

        <div class="blContainerLogo">
            <img src="/assets/logo.png" alt="Logo Leia Mais" class="blLogoImagem">
        </div>

        <div id="blRecuperarSenha" class="blCartaoInterface">
            <h1>Recuperar Senha</h1>
            <p class="blDescricaoRecuperacao">Informe seu nome de usuário para receber o código de recuperação de senha.</p>
            
            <form id="blFormuRecuperarSenha">
                <div class="blGrupoInput">
                    <label for="blUsernameRecuperacao">Usuário</label>
                    <input type="text" id="blUsernameRecuperacao" name="username" required autocomplete="username">
                </div>

                <button type="submit" class="blBotaoPrimario">Continuar</button>
            </form>

            <div class="blLinksRodape">
                <p>Lembrou a senha? <a href="/pages/usuarios/leitor/login.html" class="blLinkDestaque">Voltar para o login.</a></p>
            </div>
        </div>
    </div>

    <div class="lmAlertaOverlay" id="lmAlertaOverlay">
        <div class="lmAlertaBox">
            <h3 id="lmAlertaTitulo">Atenção</h3>
            <p id="lmAlertaMensagem">Mensagem do alerta.</p>
            <button type="button" id="lmAlertaBotao" class="lmAlertaBotao">OK</button>
        </div>
    </div>

    <script src="/js/usuarios/auth.js"></script>
    <script src="/js/usuarios/recuperarSenha.js"></script>
</body>
</html>
