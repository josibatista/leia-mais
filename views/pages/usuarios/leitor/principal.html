<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leia Mais - Página Inicial</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body class="lmAcervoBody">
  <div id="blMenuContainer"></div>
  <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

  <header class="lmCabecalho ppCabecalho">
    <div class="lmCabecalhoSuperior">
      <button class="lmCabecalhoBotao" id="lmMenuAbrirBotao" aria-label="Abrir menu">
        &#9776;
      </button>

      <img src="/assets/logoLeiaMais.png" alt="Logo Leia Mais" class="ppLogoCentral" />

      <button class="lmCabecalhoBotao" id="ppBotaoAbrirBusca" aria-label="Buscar">
        <svg
          class="lmIconeBusca"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
        </svg>
      </button>
    </div>

    <div class="lmBuscaHeader" id="ppBuscaHeader">
      <input type="text" id="ppCampoBusca" placeholder="Buscar livros no acervo" />
    </div>
  </header>

  <main class="ppConteudo">
    <section class="ppSecao">
      <div class="ppSecaoCabecalho">
        <h3>Trilhas Salvas</h3>
        <button type="button" class="ppBotaoSeta" id="ppAbrirTrilhasSalvas" aria-label="Ver trilhas salvas">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <div class="ppCarrossel" id="ppTrilhasSalvas"></div>
    </section>

    <section class="ppSecao">
      <div class="ppSecaoCabecalho">
        <h3>Leituras Recentes</h3>
        <button type="button" class="ppBotaoSeta" id="ppAbrirLivrosSalvos" aria-label="Ver livros salvos">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <div class="ppCarrossel" id="ppLeiturasRecentes"></div>
    </section>

    <section class="ppSecao">
        <div class="ppSecaoCabecalho">
            <h3>Acervo Leia Mulheres</h3>

            <button
                type="button"
                class="ppBotaoSeta"
                id="ppAbrirAcervo"
                aria-label="Abrir acervo"
            >
            <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="ppCarrossel" id="ppAcervoLivros"></div>
    </section>
  </main>

  <script src="/js/usuarios/auth.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/trilhas/trilhaFormularioItens.js"></script>
  <script src="/js/usuarios/leitor/paginaPrincipalLeitor.js"></script>
</body>
</html>
