<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Mais - Login Adm</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="blBody blBodyComMenu">
    <div id="blMenuContainer"></div>
    <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

    <header class="blCabecalhoMenuAuth">
        <button class="lmCabecalhoBotao" id="lmMenuAbrirBotao" type="button" aria-label="Abrir menu">
            &#9776;
        </button>
    </header>

    <main class="blAreaCentralAuth">
        <div class="blContainerPrincipal">

            <div class="blContainerLogo">
                <img src="/assets/logo.png" alt="Logo Leia Mais" class="blLogoImagem">
            </div>

            <div id="blLoginAdmin" class="blCartaoLogin">
                <h1>Login</h1>
                <h2 class="blSubtitulo">Conta Administrador</h2>
                
                <form id="blFormLoginAdm">
                    <div class="blGrupoInput">
                        <label for="blInputLoginAdm">Usuário ou e-mail</label>
                        <input type="text" id="blInputLoginAdm" name="usuario" required>
                    </div>

                    <div class="blGrupoInput blInputSenha">
                        <label for="blSenhaAdm">Senha</label>
                        <input type="password" id="blSenhaAdm" name="senha" required>
                        <i class="fa-solid fa-eye" id="blOlhoSenha"></i>
                        <div class="blEsqueceuSenha">
                            <a href="/pages/usuarios/recuperarSenha.html">Esqueceu a senha?</a>
                        </div>
                    </div>

                    <div class="blGrupoInput blGrupoLembrar">
                        <label for="blLembrarLoginAdm">
                            <input type="checkbox" id="blLembrarLoginAdm" name="lembrar" />
                            Lembrar de mim
                        </label>
                    </div>

                    <button type="submit" class="blBotaoPrimario">Entrar</button>
                </form>

                <div class="blLinksRodape">
                    <a href="/pages/usuarios/leitor/login.html" id="blMudarParaLeitor" class="blLinkDestaque">Entrar como leitor.</a>
                </div>
            </div>
        </div>
    </main>

    <div class="lmAlertaOverlay" id="lmAlertaOverlay">
        <div class="lmAlertaBox">
            <h3 id="lmAlertaTitulo">Atenção</h3>
            <p id="lmAlertaMensagem">Mensagem do alerta.</p>

            <button type="button" id="lmAlertaBotao" class="lmAlertaBotao">
            OK
            </button>
        </div>
    </div>

    <script src="/js/usuarios/auth.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/usuarios/adm/loginCadAdm.js"></script>
</body>
</html>
