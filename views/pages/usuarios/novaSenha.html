<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Mais - Nova Senha</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/js/usuarios/auth.js"></script>
</head>

<body class="blBody">
    <div class="blContainerPrincipal">

        <div class="blContainerLogo">
            <img src="/assets/logo.png" alt="Logo Leia Mais" class="blLogoImagem">
        </div>

        <div class="blCartaoInterface">
            <h1>Redefinir Senha</h1>
            <p class="blDescricaoRecuperacao">Digite o código recebido e sua nova senha.</p>

            <form id="blFormNovaSenha">
                <div class="blGrupoInput">
                    <label for="blCodigoRecuperacao">Código</label>
                    <input type="text" id="blCodigoRecuperacao" required placeholder="Digite o código recebido">
                </div>

                <div class="blGrupoInput blInputSenha">
                    <label for="blNovaSenha">Nova senha</label>
                    <input type="password" id="blNovaSenha" required placeholder="Digite sua nova senha" minlength="8">
                    <i class="fa-solid fa-eye" id="blOlhoSenha"></i>
                </div>

                <p class="blTextoApoioSenha">Mínimo 8 caracteres, com letra, número e símbolo.</p>

                <button type="submit" class="blBotaoPrimario">
                    Redefinir senha
                </button>
            </form>

            <div class="blLinksRodape">
                <a href="/pages/usuarios/leitor/login.html" class="blLinkDestaque">
                    Voltar para o login
                </a>
            </div>
        </div>

    </div>

    <div class="lmAlertaOverlay" id="lmAlertaOverlay">
        <div class="lmAlertaBox">
            <h3 id="lmAlertaTitulo">Atenção</h3>
            <p id="lmAlertaMensagem">Mensagem do alerta.</p>
            <button type="button" id="lmAlertaBotao" class="lmAlertaBotao">OK</button>
        </div>
    </div>

    <script src="/js/usuarios/recuperarSenha.js"></script>
</body>
</html>
