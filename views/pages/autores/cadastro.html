<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Autores | Leia Mulheres</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

  <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="lmCadastroBody">

  <div id="blMenuContainer"></div>
  <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

  <header class="lmCadastroCabecalho">
    <div class="lmCadastroCabecalhoTopo">
      <button class="lmCabecalhoBotao" id="lmMenuAbrirBotao" aria-label="Abrir menu">
        &#9776;
      </button>
    </div>

    <div class="lmCadastroCabecalhoCentro">
      <img src="/assets/logoLeiaMais.png" alt="Logo Leia Mais" class="lmCabecalhoLogoImagem" />

      <p class="lmCadastroSubtitulo">
        Área administrativa para cadastro de autoras do acervo.
      </p>
    </div>
  </header>

  <main class="lmCadastroConteudoPrincipal">
    <section class="lmCadastroSecaoFormulario">
      <div class="lmCadastroSecaoCabecalho">
        <h2 class="lmCadastroTituloSecao">Cadastro de Autoras</h2>
        <p class="lmCadastroTextoSecao">
          Preencha os campos abaixo para registrar uma nova autora no acervo.
        </p>
      </div>

      <form class="lmCadastroFormularioLivro" id="lmCadastroFormularioAutor">
        <div class="lmGrupoCampo">
          <label for="nomeAutor" class="lmRotuloCampo">Nome da autora</label>
          <input
            type="text"
            id="nomeAutor"
            name="nome"
            class="lmCampoTexto"
            placeholder="Digite o nome completo da autora"
            required
          />
        </div>

        <div class="lmGrupoCampo">
          <label for="biografiaAutor" class="lmRotuloCampo">Biografia</label>
          <textarea
            id="biografiaAutor"
            name="biografia"
            class="lmCampoTextoArea"
            placeholder="Digite uma breve biografia da autora"
          ></textarea>
        </div>

        <p class="lmCadastroMensagem" id="lmCadastroMensagem" aria-live="polite"></p>

        <div class="lmAcoesFormulario">
          <button type="button" class="lmCadastroBotaoSecundario" id="lmCadastroBotaoVoltar">
            Voltar
          </button>

          <button type="reset" class="lmCadastroBotaoSecundario">
            Cancelar
          </button>

          <button type="submit" class="lmCadastroBotaoPrimario">
            Cadastrar
          </button>
        </div>
      </form>
    </section>
  </main>

  <div class="lmAlertaOverlay" id="lmAlertaOverlay">
    <div class="lmAlertaBox">
      <h3 id="lmAlertaTitulo">Atenção</h3>
      <p id="lmAlertaMensagem">Mensagem do alerta.</p>
      <button type="button" id="lmAlertaBotao" class="lmAlertaBotao">OK</button>
    </div>
  </div>

  <script src="/js/usuarios/auth.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/autores/cadastroAutor.js"></script>
</body>
</html>
