<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Trilhas | Leia Mulheres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="lmCadastroBody">

  <div id="blMenuContainer"></div>
  <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

  <header class="lmCadastroCabecalho">
    <div class="lmCadastroCabecalhoTopo">
      <button class="lmCabecalhoBotao" id="lmMenuAbrirBotao" aria-label="Abrir menu">
        &#9776;
      </button>
    </div>

    <div class="lmCadastroCabecalhoCentro">
      <img src="/assets/logoLeiaMais.png" alt="Logo Leia Mais" class="lmCabecalhoLogoImagem"/>
      <p class="lmCadastroSubtitulo">
        Área administrativa para cadastro de trilhas do catálogo.
      </p>
    </div>
  </header>

  <main class="lmCadastroConteudoPrincipal">
    <section class="lmCadastroSecaoFormulario">
      <div class="lmCadastroSecaoCabecalho">
        <h2 class="lmCadastroTituloSecao">Cadastro de Trilhas</h2>
        <p class="lmCadastroTextoSecao">
          Preencha os campos abaixo para registrar uma nova trilha no catálogo.
        </p>
      </div>

      <form class="lmCadastroFormularioLivro" id="lmCadastroFormularioTrilha">
        <div class="lmGrupoCampo">
          <label for="tema" class="lmRotuloCampo">Tema da trilha</label>
          <input
            type="text"
            id="tema"
            name="tema"
            class="lmCampoTexto"
            placeholder="Digite o tema da trilha"
            required
          />
        </div>

        <div class="lmGrupoCampo">
          <label for="descricao" class="lmRotuloCampo">Descrição</label>
          <textarea
            id="descricao"
            name="descricao"
            class="lmCampoTextoArea"
            placeholder="Digite a descrição da trilha"
          ></textarea>
        </div>

        <div class="lmGrupoLinha">
          <div class="lmGrupoCampo">
            <label for="nivelDificuldade" class="lmRotuloCampo">Nível de dificuldade</label>
            <select id="nivelDificuldade" name="nivelDificuldade" class="lmCampoSelecao" required></select>
          </div>

          <div class="lmGrupoCampo">
            <label for="xp" class="lmRotuloCampo">XP</label>
            <input
              type="number"
              id="xp"
              name="xp"
              class="lmCampoTexto"
              placeholder="Ex: 10"
              min="0"
              required
            />
          </div>
        </div>

        <div class="lmGrupoCampo">
          <label for="idObra" class="lmRotuloCampo">Obras</label>

          <div class="lmCadastroAutoresLinha">
            <div class="lmCadastroAutocomplete">
              <input
                type="text"
                id="idObra"
                class="lmCampoTexto"
                placeholder="Digite ou selecione uma obra"
                autocomplete="off"
              />

              <div class="lmCadastroAutocompleteLista" id="lmListaObrasDisponiveis"></div>
            </div>

            <button
              type="button"
              class="lmCadastroBotaoAdicionarAutor"
              id="lmAdicionarObra"
              aria-label="Adicionar obra"
            >
              +
            </button>
          </div>

          <div class="lmCadastroAcoesAutor">
            <button type="button" class="lmCadastroLinkAutor" id="lmCadastrarNovaObra">
              Cadastrar nova obra
            </button>
          </div>
        </div>

        <div class="lmGrupoCampo">
          <label for="idLivro" class="lmRotuloCampo">Livros</label>

          <div class="lmCadastroAutoresLinha">
            <div class="lmCadastroAutocomplete">
              <input
                type="text"
                id="idLivro"
                class="lmCampoTexto"
                placeholder="Digite ou selecione um livro"
                autocomplete="off"
              />

              <div class="lmCadastroAutocompleteLista" id="lmListaLivrosDisponiveis"></div>
            </div>

            <button
              type="button"
              class="lmCadastroBotaoAdicionarAutor"
              id="lmAdicionarLivro"
              aria-label="Adicionar livro"
            >
              +
            </button>
          </div>

          <div class="lmCadastroAcoesAutor">
            <button type="button" class="lmCadastroLinkAutor" id="lmCadastrarNovoLivro">
              Cadastrar novo livro
            </button>
          </div>
        </div>

        <div class="lmGrupoCampo">
          <label class="lmRotuloCampo">Itens da trilha</label>
          <div id="lmListaItensTrilha" class="lmContainerListaItensTrilha"></div>
        </div>

        <div class="lmGrupoCampo">
          <label for="imagemCapa" class="lmRotuloCampo">Imagem de capa</label>
          <input
            type="file"
            id="imagemCapa"
            name="imagemCapa"
            class="lmCampoArquivo"
            accept="image/*"
          />
          <img
            id="lmPreviewCapaTrilha"
            class="vtCapaTrilha"
            src="/assets/capaPadrao.jpg"
            alt="Preview da capa da trilha"
          />
        </div>

        <div class="lmGrupoCampo lmGrupoCampoCheck">
          <label class="lmRotuloCheckbox" for="liberada">
            <input
              type="checkbox"
              id="liberada"
              name="liberada"
              class="lmCampoCheckBox"
            />
            <span>Trilha liberada?</span>
          </label>
        </div>

        <p class="lmCadastroMensagem" id="lmCadastroMensagem" aria-live="polite"></p>

        <div class="lmAcoesFormulario">
          <button type="button" class="lmCadastroBotaoSecundario" id="lmCadastroBotaoVoltar">Voltar</button>
          <button type="reset" class="lmCadastroBotaoSecundario" id="lmCadastroBotaoCancelar">
            Cancelar
          </button>
          <button type="submit" class="lmCadastroBotaoPrimario">Cadastrar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/usuarios/auth.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/trilhas/trilhaFormularioItens.js"></script>
  <script src="/js/trilhas/crudTrilhas.js"></script>
</body>
</html>
