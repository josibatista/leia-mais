<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leia Mais - Trilhas Salvas</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png" />
  <link rel="manifest" href="/assets/favicon_io/site.webmanifest" />

  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body class="lmAcervoBody">
  <div id="blMenuContainer"></div>
  <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

  <header class="lmCabecalho">
    <div class="lmCabecalhoSuperior">
      <button class="lmCabecalhoBotao" id="lmMenuAbrirBotao" aria-label="Abrir menu">
        &#9776;
      </button>

      <img src="/assets/logoLeiaMais.png" alt="Logo Leia Mais" class="ppLogoCentral" />

      <button class="lmCabecalhoBotao" id="lmBotaoVoltarPerfil" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </div>
  </header>

  <main class="blConteudoPrincipal blConteudoLeitor">
    <section class="blSecaoLista">
      <div class="blListaCabecalho">
        <div class="blLivrosTitulos">
          <h3>Trilhas Salvas</h3>

          <div class="blMenuLivros">
            <button class="blFiltroLivro ativo" data-status="todos">Trilhas</button>
            <button class="blFiltroLivro" data-status="para ler">Para Ler</button>
            <button class="blFiltroLivro" data-status="em andamento">Lendo</button>
            <button class="blFiltroLivro" data-status="pausada">Pausadas</button>
            <button class="blFiltroLivro" data-status="concluída">Concluídas</button>
          </div>
        </div>
      </div>

      <div class="blGradeTrilhasSalvas" id="blGradeTrilhasSalvas"></div>
    </section>
  </main>

  <div class="lmModalOverlay" id="tsModalMensagem">
    <div class="lmModalConteudo lmModalMensagemConteudo">
      <button class="lmModalFechar" id="tsFecharModalMensagem" type="button">
        &times;
      </button>

      <h2 class="lmModalTitulo" id="tsModalMensagemTitulo">Atenção</h2>

      <p class="lmModalMensagemTexto" id="tsModalMensagemTexto"></p>

      <div class="lmModalMensagemAcoes">
        <button type="button" class="lmBotaoSaibaMais" id="tsBotaoConfirmarMensagem">
          OK
        </button>
      </div>
    </div>
  </div>

  <script src="/js/usuarios/auth.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/trilhas/trilhaFormularioItens.js"></script>
  <script src="/js/trilhas/trilhasSalvas.js"></script>
</body>
</html>
