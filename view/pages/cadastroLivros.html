<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Livros | Leia Mulheres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/view/css/style.css" />
</head>
<body class="lmCadastroBody">
  <aside class="lmMenuLateral" id="lmMenuLateral">
    <div class="lmMenuLateralCabecalho lmMenuLateralLogoAdmin">
      <div class="lmMenuMarcaAdmin">
        <img src="/view/assets/logoLeiaMais.png" alt="Logo Leia Mais" class="lmMenuLogoAdmin" />
        <span class="lmMenuNomeAdmin">Leia+</span>
      </div>
      <button class="lmMenuFecharBotao" id="lmMenuFecharBotao" aria-label="Fechar menu">
        &times;
      </button>
    </div>

    <nav class="lmMenuNavegacao">
      <a href="perfilLeitor.html" class="lmMenuItem"><span>Perfil</span><span>&gt;</span></a>
      <a href="dashboard.html" class="lmMenuItem"><span>Dashboard</span><span>&gt;</span></a>
      <a href="usuarios.html" class="lmMenuItem"><span>Usuários</span><span>&gt;</span></a>
      <a href="acervoLivros.html" class="lmMenuItem"><span>Livros</span><span>&gt;</span></a>
      <a href="autores.html" class="lmMenuItem"><span>Autores</span><span>&gt;</span></a>
      <a href="trilhas.html" class="lmMenuItem"><span>Trilhas</span><span>&gt;</span></a>
    </nav>

    <div class="lmMenuRodape">
      <a href="#" class="lmMenuSair">
        <svg class="lmIconeSair" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sair</span>
      </a>

      <button class="lmBotaoTema" id="lmBotaoTema" aria-label="Alternar tema">
        <svg class="lmIconeTema" id="lmIconeTema" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4"></line>
          <line x1="12" y1="20" x2="12" y2="22"></line>
          <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
          <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
          <line x1="2" y1="12" x2="4" y2="12"></line>
          <line x1="20" y1="12" x2="22" y2="12"></line>
          <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
          <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
        </svg>
      </button>
    </div>
  </aside>

  <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

  <header class="lmCadastroCabecalho">
    <div class="lmCadastroCabecalhoTopo">
      <button class="lmCabecalhoBotao" id="lmMenuAbrirBotao" aria-label="Abrir menu">
        &#9776;
      </button>
    </div>

    <div class="lmCadastroCabecalhoCentro">
      <img src="/view/assets/logoLeiaMais.png" alt="Logo Leia Mais" class="lmCabecalhoLogoImagem"/>
      <img
        src="/view/assets/logoLeiaClaro.png"
        alt="Logo Leia Mulheres"
        class="lmCadastroTituloProjetoImagem"
        id="lmCadastroTituloProjetoImagem"
      />
      <p class="lmCadastroSubtitulo">
        Área administrativa para cadastro de livros do acervo.
      </p>
    </div>
  </header>

  <main class="lmCadastroConteudoPrincipal">
    <section class="lmCadastroSecaoFormulario">
      <div class="lmCadastroSecaoCabecalho">
        <h2 class="lmCadastroTituloSecao">Cadastro de Livros</h2>
        <p class="lmCadastroTextoSecao">
          Preencha os campos abaixo para registrar um novo livro no acervo.
        </p>
      </div>

      <form class="lmCadastroFormularioLivro" id="lmCadastroFormularioLivro" enctype="multipart/form-data">
        <div class="lmCadastroGrupoCampo">
          <label for="titulo" class="lmCadastroRotuloCampo">Nome do livro</label>
          <input
            type="text"
            id="titulo"
            name="titulo"
            class="lmCadastroCampoTexto"
            placeholder="Digite o título do livro"
            required
          />
        </div>

        <div class="lmCadastroGrupoCampo">
          <label for="editora" class="lmCadastroRotuloCampo">Editora</label>
          <input
            type="text"
            id="editora"
            name="editora"
            class="lmCadastroCampoTexto"
            placeholder="Digite a editora"
            required
          />
        </div>

        <div class="lmCadastroGrupoCampo">
          <label for="paginas" class="lmCadastroRotuloCampo">Número de páginas</label>
          <input
            type="number"
            id="paginas"
            name="paginas"
            class="lmCadastroCampoTexto"
            placeholder="Digite o número de páginas"
            min="1"
            required
          />
        </div>

        <div class="lmCadastroGrupoCampo">
          <label for="idAutor" class="lmCadastroRotuloCampo">Autor</label>
          <select
            id="idAutor"
            name="idAutor"
            class="lmCadastroCampoSelecao"
            required
          >
            <option value="">Carregando autores...</option>
          </select>
        </div>

        <div class="lmCadastroGrupoLinha">
          <div class="lmCadastroGrupoCampo">
            <label for="anoPublicacao" class="lmCadastroRotuloCampo">Ano de publicação</label>
            <input
              type="number"
              id="anoPublicacao"
              name="anoPublicacao"
              class="lmCadastroCampoTexto"
              placeholder="Ex: 2024"
              min="0"
              required
            />
          </div>

          <div class="lmCadastroGrupoCampo">
            <label for="genero" class="lmCadastroRotuloCampo">Gênero</label>
            <input
              type="text"
              id="genero"
              name="genero"
              class="lmCadastroCampoTexto"
              placeholder="Ex: Romance"
              required
            />
          </div>
        </div>

        <div class="lmCadastroGrupoCampo">
          <label for="descricao" class="lmCadastroRotuloCampo">Descrição</label>
          <textarea
            id="descricao"
            name="descricao"
            class="lmCadastroCampoTextoArea"
            placeholder="Digite a descrição do livro"
          ></textarea>
        </div>

        <div class="lmCadastroGrupoCampo">
          <label for="imagemCapa" class="lmCadastroRotuloCampo">Imagem de capa</label>
          <input
            type="file"
            id="imagemCapa"
            name="imagemCapa"
            class="lmCadastroCampoArquivo"
            accept="image/*"
          />
        </div>

        <p class="lmCadastroMensagem" id="lmCadastroMensagem" aria-live="polite"></p>

        <div class="lmCadastroAcoesFormulario">
          <button type="button" class="lmCadastroBotaoSecundario" id="lmCadastroBotaoVoltar">Voltar</button>
          <button type="reset" class="lmCadastroBotaoSecundario">Cancelar</button>
          <button type="submit" class="lmCadastroBotaoPrimario">Cadastrar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/view/js/crudLivros.js"></script>
</body>
</html>
