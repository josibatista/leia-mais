<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Obras | Leia Mulheres</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon_io/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon_io/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="lmCadastroBody">
    <div id="blMenuContainer"></div>
    <div class="lmMenuOverlay" id="lmMenuOverlay"></div>

    <header class="lmCadastroCabecalho">
      <div class="lmCadastroCabecalhoTopo">
        <button
          class="lmCabecalhoBotao"
          id="lmMenuAbrirBotao"
          aria-label="Abrir menu"
        >
          &#9776;
        </button>
      </div>

      <div class="lmCadastroCabecalhoCentro">
        <img
          src="../assets/logoLeiaMais.png"
          alt="Logo Leia Mais"
          class="lmCabecalhoLogoImagem"
        />
        <p class="lmCadastroSubtitulo">
          Área administrativa para cadastro de obras.
        </p>
      </div>
    </header>

    <main class="lmCadastroConteudoPrincipal">
      <section class="lmCadastroSecaoFormulario">
        <div class="lmCadastroSecaoCabecalho">
          <h2 class="lmCadastroTituloSecao">Cadastro de Obras</h2>
          <p class="lmCadastroTextoSecao">
            Preencha os campos abaixo para registrar uma nova obra no acervo.
            <!--Deixo aqui como acervo mesmo que as obras em teoria não sejam do Leia mulheres? Ou troco por alguma outra palavra tipo "Cadastrar uma nova obra no sistema"? Eu já tive a minha resposta mas não deu tempo de mudar então vou deixar o comentário aqui por enquanto-->
          </p>
        </div>

        <form
          class="lmCadastroFormularioObras"
          id="lmCadastroFormularioObras"
          enctype="multipart/form-data"
        >
          <div class="lmGrupoCampo">
            <label for="titulo" class="lmRotuloCampo"
              >Nome da obra</label
            >
            <input
              type="text"
              id="titulo"
              name="titulo"
              class="lmCampoTexto"
              placeholder="Digite o título da obra"
              required
            />
          </div>

          <div class="lmGrupoCampo">
            <label for="idTipo" class="lmRotuloCampo">Tipo da Obra</label>

            <div class="lmCadastroAutocomplete">
              <input
                type="text"
                id="idTipo"
                name="tipo"
                class="lmCampoTexto"
                placeholder="Digite ou selecione o tipo da obra"
                autocomplete="off"
                required
              />

              <div
                class="lmCadastroAutocompleteLista"
                id="lmListaTiposDisponiveis"
              ></div>
            </div>
          </div>

          <div class="lmGrupoCampo">
            <label for="idAutor" class="lmRotuloCampo">Autores</label>

            <div class="lmCadastroAutoresLinha">
              <div class="lmCadastroAutocomplete">
                <input
                  type="text"
                  id="idAutor"
                  class="lmCampoTexto"
                  placeholder="Digite ou selecione uma autora"
                  autocomplete="off"
                />

                <div
                  class="lmCadastroAutocompleteLista"
                  id="lmListaAutoresDisponiveis"
                ></div>
              </div>

              <button
                type="button"
                class="lmCadastroBotaoAdicionarAutor"
                id="lmAdicionarAutor"
                aria-label="Adicionar autora"
              >
                +
              </button>
            </div>

            <div class="lmCadastroAcoesAutor">
              <button
                type="button"
                class="lmCadastroLinkAutor"
                id="lmCadastrarNovoAutor"
              >
                Cadastrar nova autora
              </button>
            </div>

            <div
              class="lmCadastroListaAutores"
              id="lmListaAutoresSelecionados"
            ></div>
          </div>

          <div class="lmGrupoCampo">
            <label for="descricao" class="lmRotuloCampo"
              >Descrição</label
            >
            <textarea
              id="descricao"
              name="descricao"
              class="lmCampoTextoArea"
              placeholder="Digite a descrição do livro"
            ></textarea>
          </div>

          <p
            class="lmCadastroMensagem"
            id="lmCadastroMensagem"
            aria-live="polite"
          ></p>

          <div class="lmAcoesFormulario">
            <button
              type="button"
              class="lmCadastroBotaoSecundario"
              id="lmCadastroBotaoVoltar"
            >
              Voltar
            </button>
            <button type="reset" class="lmCadastroBotaoSecundario">
              Cancelar
            </button>
            <button type="submit" class="lmCadastroBotaoPrimario">
              Cadastrar
            </button>
          </div>
        </form>
      </section>
    </main>

    <div class="lmAlertaOverlay" id="lmAlertaOverlay">
      <div class="lmAlertaBox">
        <h3 id="lmAlertaTitulo">Atenção</h3>
        <p id="lmAlertaMensagem">Mensagem do alerta.</p>
        <button type="button" id="lmAlertaBotao" class="lmAlertaBotao">OK</button>
      </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/crudObras.js"></script>
  </body>
</html>
