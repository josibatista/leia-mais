<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leia Mais - Nova Senha</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="blContainerPrincipal">

        <div class="blContainerLogo">
            <img src="../assets/logo.png" alt="Logo Leia Mais" class="blLogoImagem">
        </div>

        <div class="blCartaoInterface">
            <h1>Redefinir Senha</h1>
            <p class="blDescricaoRecuperacao">Digite o código recebido e sua nova senha.</p>

            <form id="blFormNovaSenha">
                <div class="blGrupoInput">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" required>
                </div>

                <div class="blGrupoInput">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" required>
                </div>

                <button type="submit" class="blBotaoPrimario">
                    Redefinir senha
                </button>
            </form>

            <div class="blLinksRodape">
                <a href="loginLeitor.html" class="blLinkDestaque">
                    Voltar para o login
                </a>
            </div>
        </div>

    </div>

    <script src="../js/recuperarConta.js"></script>
</body>
</html>
